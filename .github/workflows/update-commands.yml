name: "Update commands"
on:
  schedule:
    - cron: "0 0 * * 1" # every Monday
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      # for shogo82148/actions-github-app-token
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@a99edab616eaa8a66bbc16363c77a83361e5f2ce # v1.44.3
        with:
          perl-version: "5"

      - name: Install
        run: cpanm --quiet --installdeps --notest .

      - name: Generate
        run: perl author/generate_commands.pl

      - name: Test
        run: prove -l t/00_compile.t t/12_filters.t

      - name: Generate token
        id: generate_token
        uses: shogo82148/actions-github-app-token@bf955a861ff7c9d64c86b567bac12d7baae5614a # v1.3.4

      - name: Commit and create a pull request
        uses: shogo82148/actions-commit-and-create-pr@b1322fe9da4037e9720e34ea221997cffcd3498d # v1.1.4
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          head-branch-prefix: "auto-update-commands/"
          commit-message: "update the generated commands"
          title: "Update the generated commands"
          body: |
            This pull request is created by the "Update commands" workflow.
            It regenerates the methods of Redis commands from the command references of Redis and Valkey.

            - https://raw.githubusercontent.com/redis/docs/refs/heads/main/data/commands.json
            - https://github.com/valkey-io/valkey/tree/(the latest release)/src/commands
